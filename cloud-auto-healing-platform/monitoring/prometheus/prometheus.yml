
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "fastapi-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["demo-app:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    
  - job_name: "docker-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["docker-exporter:9101"]

  - job_name: "auto-healing"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:9102"]
